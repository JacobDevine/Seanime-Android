name: Build server

# Builds libseanime.so (the Go server) for arm64 + armeabi-v7a with scripts/build-server.sh.
# Run it by hand from the Actions tab, or it runs on PRs that change the build script.
# Release APKs are still built and signed locally; this only produces the server files
# and a debug APK to try them with.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Seanime server version (e.g. 3.10.4)
        required: true
        default: 3.10.4
  pull_request:
    paths:
      - scripts/build-server.sh
      - .github/workflows/build-server.yml

env:
  SERVER_VERSION: ${{ inputs.version || '3.10.4' }}
  NDK_VERSION: 26.3.11579264

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          fi

      - name: Build server ${{ env.SERVER_VERSION }}
        run: scripts/build-server.sh "$SERVER_VERSION"

      - name: Build debug APK with the server
        run: ./gradlew assembleDebug

      # Unzip this into app/src/main/jniLibs/ to build a release locally.
      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs-s${{ env.SERVER_VERSION }}
          path: app/src/main/jniLibs/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-s${{ env.SERVER_VERSION }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
